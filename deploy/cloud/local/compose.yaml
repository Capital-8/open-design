# Only local business PostgreSQL. Account/auth/billing/runtime stay on the cloud AMR platform.
name: open-design-cloud-local
services:
  postgres:
    # Match the existing POC's tested PostgreSQL baseline and cached platform.
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    platform: linux/amd64
    environment:
      POSTGRES_USER: cloud_local
      POSTGRES_DB: open_design_cloud_local
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${OD_CLOUD_LOCAL_DB_PORT:-15432}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 30s
secrets:
  postgres_password:
    file: ${OD_CLOUD_LOCAL_DB_PASSWORD_FILE:?Set the absolute path to the private local password file}
volumes:
  database: {}
