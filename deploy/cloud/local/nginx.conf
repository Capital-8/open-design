worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s;
  server {
    listen 8080;
    # Backend attachment batches are bounded at 25 MiB; JSON remains 1 MiB.
    client_max_body_size 25m;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api|artifacts|frames)(/|$)|^/(health|ready|version)$ {
      set $backend http://cloud:19000;
      proxy_pass $backend$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
    }
    location = /edge-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ^~ /_next/static/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /onboarding { try_files /index.html =404; add_header Cache-Control no-store; }
    location = /onboarding/ { try_files /index.html =404; add_header Cache-Control no-store; }
    location = /index.html { add_header Cache-Control no-store; }
    location ^~ /projects/ {
      try_files /index.html =404;
      add_header Cache-Control no-store;
    }
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:js|css|map|html|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|json|webmanifest|mp4|webm|mp3|wav)$ {
      try_files $uri =404;
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control no-store;
    }
  }
}
