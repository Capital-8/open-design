name: pack-cost-experiment
on:
  push:
    branches: [experiment/pack-cost-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  types:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Paired typecheck measurements
        run: node .github/scripts/release/benchmark-types.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: type-cost-${{ matrix.runner }}
          path: .tmp/type-benchmark
          include-hidden-files: true
          retention-days: 7
