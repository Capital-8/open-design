name: dogfood-import-manifest
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed release-beta run with retained installer artifacts
        required: true
        type: string
      version:
        description: Exact version built by the original run
        required: true
        type: string
      environment:
        description: Target environment of the original build (label only)
        required: true
        type: string
permissions:
  actions: read
  contents: read
concurrency:
  group: dogfood-import-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  backfill:
    if: github.repository == 'nexu-io/open-design'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Download original installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.run_id }}
        run: gh run download "$ORIGINAL_RUN" --repo "$GITHUB_REPOSITORY" --pattern 'open-design-beta-*-*' --dir "$RUNNER_TEMP/dogfood-artifacts"
      - name: Publish recovered dogfood build
        env:
          GH_TOKEN: ${{ github.token }}
          DOGFOOD_RUN_ID: ${{ inputs.run_id }}
          DOGFOOD_VERSION: ${{ inputs.version }}
          DOGFOOD_ENVIRONMENT: ${{ inputs.environment }}
          DOGFOOD_ARTIFACT_DIR: ${{ runner.temp }}/dogfood-artifacts
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: pnpm exec tools-release backfill-dogfood
